name: holdfast

x-bookings-image: &bookings-image
  build:
    context: .
    args:
      SERVICE: bookings
  image: holdfast-bookings:local

x-database-url: &database-url
  DATABASE_URL: postgresql+asyncpg://holdfast:holdfast@database:5432/holdfast

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast
      POSTGRES_DB: holdfast
    # An uncommon port on this machine only: no clash with other Postgres servers on the host,
    # and the development password never faces the network.
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=holdfast --dbname=holdfast"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every email the worker sends; read them in its web interface on this machine.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:8025:8025"

  migrate:
    <<: *bookings-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *database-url
    depends_on:
      database:
        condition: service_healthy

  api:
    <<: *bookings-image
    command: ["uvicorn", "holdfast.bookings.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *database-url
      # Local development only. Every deployed environment sets its own random secret.
      JWT_SECRET: local-development-secret-never-used-anywhere-else
    # This machine only: seeded accounts share a published password.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *bookings-image
    command: ["python", "-m", "holdfast.bookings.worker"]
    # Longer than the slowest job, a reminder whose send is cut off at SEND_DEADLINE_SECONDS,
    # so that `docker compose stop` lets the job in hand finish.
    stop_grace_period: 2m
    environment:
      <<: *database-url
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Holdfast <reminders@example.com>"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  database-data:
