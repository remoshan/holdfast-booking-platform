name: holdfast

x-bookings-image: &bookings-image
  build:
    context: .
    args:
      SERVICE: bookings
  image: holdfast-bookings:local

x-notifications-image: &notifications-image
  build:
    context: .
    args:
      SERVICE: notifications
  image: holdfast-notifications:local

x-payments-image: &payments-image
  build:
    context: .
    args:
      SERVICE: payments
  image: holdfast-payments:local

x-bookings-database-url: &bookings-database-url
  DATABASE_URL: postgresql+asyncpg://holdfast:holdfast@bookings-database:5432/holdfast

x-notifications-database-url: &notifications-database-url
  DATABASE_URL: postgresql+asyncpg://notifications:notifications@notifications-database:5432/notifications

x-payments-database-url: &payments-database-url
  DATABASE_URL: postgresql+asyncpg://payments:payments@payments-database:5432/payments

x-rabbitmq-url: &rabbitmq-url
  RABBITMQ_URL: amqp://holdfast:holdfast@rabbitmq:5672/

services:
  # Each service has a database of its own, which no other service reads.
  bookings-database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast
      POSTGRES_DB: holdfast
    # An uncommon port on this machine only: no clash with other Postgres servers on the host,
    # and the development password never faces the network.
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=holdfast --dbname=holdfast"]
      interval: 2s
      timeout: 5s
      retries: 15

  notifications-database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    volumes:
      - notifications-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=notifications --dbname=notifications"]
      interval: 2s
      timeout: 5s
      retries: 15

  payments-database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    volumes:
      - payments-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=payments --dbname=payments"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every email the notifications service sends; read them in its web interface on this
  # machine.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:8025:8025"

  # Carries the messages between services. Its management UI, on this machine only, shows the
  # queues and the messages waiting in them.
  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    # The node takes its name, and with it the folder its data lives in, from the hostname.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: holdfast
      RABBITMQ_DEFAULT_PASS: holdfast
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  bookings-migrate:
    <<: *bookings-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *bookings-database-url
    depends_on:
      bookings-database:
        condition: service_healthy

  bookings-api:
    <<: *bookings-image
    command: ["uvicorn", "holdfast.bookings.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *bookings-database-url
      # Local development only. Every deployed environment sets its own random secret.
      JWT_SECRET: local-development-secret-never-used-anywhere-else
    # This machine only: seeded accounts share a published password.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bookings-migrate:
        condition: service_completed_successfully

  bookings-worker:
    <<: *bookings-image
    command: ["python", "-m", "holdfast.bookings.worker"]
    # Longer than a page of the outbox can wait for RabbitMQ's confirms, so that
    # `docker compose stop` lets the work in hand finish.
    stop_grace_period: 30s
    environment:
      <<: [*bookings-database-url, *rabbitmq-url]
    depends_on:
      bookings-migrate:
        condition: service_completed_successfully
      # Started, not healthy: the worker must run its jobs, holds' expiries among them, even while
      # the broker is down. Its relay connects whenever the broker is there.
      rabbitmq:
        condition: service_started

  notifications-migrate:
    <<: *notifications-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *notifications-database-url
    depends_on:
      notifications-database:
        condition: service_healthy

  notifications-worker:
    <<: *notifications-image
    command: ["python", "-m", "holdfast.notifications.worker"]
    # Longer than the slowest job, an email whose send is cut off at SEND_DEADLINE_SECONDS, so
    # that `docker compose stop` lets the job in hand finish.
    stop_grace_period: 2m
    environment:
      <<: [*notifications-database-url, *rabbitmq-url]
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: "Holdfast <bookings@example.com>"
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      # Started, not healthy: the emails already received go out even while the broker is down.
      rabbitmq:
        condition: service_started

  payments-migrate:
    <<: *payments-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *payments-database-url
    depends_on:
      payments-database:
        condition: service_healthy

  payments-worker:
    <<: *payments-image
    command: ["python", "-m", "holdfast.payments.worker"]
    # Longer than the slowest job, a provider call cut off at PROVIDER_TIMEOUT, so that
    # `docker compose stop` lets the job in hand finish.
    stop_grace_period: 30s
    environment:
      <<: [*payments-database-url, *rabbitmq-url]
      # For trying failures out by hand: set them in the shell that runs `make up`.
      PROVIDER_DELAY_SECONDS: ${PROVIDER_DELAY_SECONDS:-0}
      PROVIDER_FAILURE_RATE: ${PROVIDER_FAILURE_RATE:-0}
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      # Started, not healthy: the commands already received are carried out even while the
      # broker is down.
      rabbitmq:
        condition: service_started

volumes:
  database-data:
  notifications-data:
  payments-data:
  rabbitmq-data:
