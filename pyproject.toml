[project]
name = "holdfast"
version = "0.1.0"
description = "Multi-tenant booking platform for shared spaces that guarantees no double-booking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francis Remoshan" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]

[tool.alembic]
script_location = "migrations"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
