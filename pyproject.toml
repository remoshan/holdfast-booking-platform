# A uv workspace with one project per service, each in its own folder under services/. Every
# service keeps its own dependencies and its own type-check, import-rule and test settings; the
# development tools and the lint and format rules below are shared by all of them.

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
# The workspace root has no requires-python for Ruff to read it from.
target-version = "py314"
# Each service's own packages, such as holdfast and the scripts its tests import, are first-party.
src = ["services/*", "services/*/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "PT", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and sign in with fixed fake credentials.
"**/tests/**" = ["S101", "S105", "S106"]
# Seed data needs repeatable randomness, not secrecy.
"**/scripts/**" = ["S311"]
